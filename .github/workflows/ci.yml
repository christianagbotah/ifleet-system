name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mariadb://ifleet_ci@127.0.0.1:3306/ifleet_ci
      NEXTAUTH_SECRET: ci-only-placeholder-not-for-production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Secret scan
        run: bun run security:scan

      - name: Test
        env:
          NODE_ENV: test
        run: bun run test

      - name: Lint
        run: bun run lint

      - name: Build
        env:
          NODE_ENV: production
        run: bun run build
