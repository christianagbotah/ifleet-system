name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: mysql://ci@127.0.0.1:3306/ifleet_ci
      NEXTAUTH_SECRET: ci-only-nextauth-secret
      INTERNAL_API_KEY: ci-only-internal-api-key
      WARMUP_SECRET: ci-only-warmup-secret
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check tracked secrets
        run: bash scripts/ci/check-no-secrets.sh

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun test

      - name: Validate Prisma schema
        run: bunx prisma validate

      - name: Build
        run: bun run build
