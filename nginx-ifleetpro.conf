# ══════════════════════════════════════════════════════════════
# iFleetPro — Nginx Config for Next.js on Webuzo
# ══════════════════════════════════════════════════════════════
#
# Place at:
#   /var/webuzo-data/nginx/custom/domains/ifleetpro.lightworldtech.com.conf
#
# NOTE: Webuzo's main nginx config already defines proxy_buffer_size,
# proxy_buffers, proxy_http_version, proxy_set_header, etc. — so
# we only set directives that are NOT in the main config to avoid
# "duplicate directive" errors.
#
# Key optimizations for Next.js:
#   1. Disables proxy caching (Next.js handles SSR/ISR itself)
#   2. Browser caching for static assets (content-hashed by Next.js)
#
# ══════════════════════════════════════════════════════════════

# Point Webuzo's proxy variable to the Next.js standalone server
set $webuzoproxy http://127.0.0.1:3000;

# ── Disable nginx proxy caching for Next.js ──
# Next.js handles its own caching (ISR, etc.), so nginx should not cache.
# Without this, Webuzo's default 60-min proxy_cache causes stale HTML
# to be served after deployments (old chunk filenames → "Loading..." screen).
proxy_no_cache 1;

# ── Live tracking WebSocket / Socket.IO ──
# Keep the tracking daemon private on localhost; nginx is the only public ingress.
location ^~ /socket.io/ {
    proxy_pass http://127.0.0.1:3033;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering off;
}

# ── Static asset caching ──
# Next.js uses content hashes in filenames (_next/static/...), so these
# files never change. Safe to cache aggressively in the browser.
location /_next/static/ {
    proxy_pass $webuzoproxy;
    expires 365d;
    add_header Cache-Control "public, immutable";
    access_log off;
}

# ── Next.js image optimization ──
location /_next/image {
    proxy_pass $webuzoproxy;
    proxy_no_cache 1;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
}

# ── Favicon and other root static files ──
location ~* \.(ico|svg|png|jpg|jpeg|gif|webp|woff|woff2|ttf|eot)$ {
    proxy_pass $webuzoproxy;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    access_log off;
}
